  <section class="pc">
    <img src="./assets/images/back/back_1.jpg" style="filter:opacity(10%)" class="bg">
    <video autoplay muted loop playsinline id="bg-video" class="bg">
      <source src="./assets/videos/back.mp4" type="video/mp4">
    </video>
    <div class="overlay">
      <div class="top-panel">
        <!-- Start menu -->
        <div class="top-item left-corner-item is-desktop-only">
          <input type="radio" class="checkbox m-1 is-hoverable anim-element medium-scale" id="workspace_1" name="workspace" value=1 checked />
          <input type="radio" class="checkbox m-1 is-hoverable anim-element medium-scale" id="workspace_2" name="workspace" value=2 />
          <input type="radio" class="checkbox m-1 is-hoverable anim-element medium-scale" id="workspace_3" name="workspace" value=3 />
          <p class="navigator-directory ml-3">root@mntbliss ~ #</p>
        </div>
        
        <!-- Clock menu -->
        <div class="top-item">
          <p class="top-text" id="clock-date"></p>
        </div>
        
        <!-- Power menu -->
        <div class="top-item right-corner-item is-desktop-only">
          <img class="is-20x20 mr-2 is-flex" src="./assets/images/icons/signal.svg" />
          <p class="is-hoverable anim-element medium-scale top-text mr-2"><img class="is-20x20 mr-1" src="./assets/images/icons/volume-down.svg" />0%</p>
          <img class="is-hoverable anim-element medium-scale is-20x20 mr-2 is-flex" src="./assets/images/icons/music-icon.svg" />
          <img class="is-hoverable anim-element medium-scale is-20x20 mr-1" src="./assets/images/icons/messenger.svg" />
          <img class="is-hoverable anim-element medium-scale is-24x24 ml-5" src="./assets/images/icons/power.svg" />
        </div>
      </div>

      <!-- <div class="is-flex is-512x512">
        <img src="./assets/images/avatar.jpg" class="avatar pulsing" />
      </div> -->
    </div>
  </section>
